apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: Argo CD
  description: Homelab GitOps UI, restricted to Argo CD administrators
  origin: https://argocd.lan.archaic.work
  redirectUrl:
    - https://argocd.lan.archaic.work/auth/callback
  public: false
  strictRedirectUrl: true
  scopeMap:
    - group: argocd-admins
      scopes:
        - openid
        - profile
        - groups
  # Do not rely on a short 'admin' RBAC group: the observed standard OIDC
  # groups claim contains argocd-admins@auth.archaic.work (and group UUIDs).
  # Match that actual full SPN in Argo CD RBAC; see apps/kanidm/oidc.md.
  claimMap:
    - name: groups
      joinStrategy: array
      valuesMap:
        - group: argocd-admins
          values:
            - admin
  # Kaniop writes the generated credentials Secret into this same namespace.
  # Argo CD requires this label to dereference external OIDC Secret values.
  secretTemplate:
    labels:
      app.kubernetes.io/part-of: argocd
