apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-services
spec:
  # Cilium-generated Gateway Services have this label; do not announce
  # unrelated LoadBalancer or ExternalIP Services.
  serviceSelector:
    matchExpressions:
      - key: gateway.networking.k8s.io/gateway-name
        operator: Exists
  # Exclude the small, intentionally tainted cp-02 from north/south traffic.
  # cp-03 is on a different physical host from cp-01 and worker-02.
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
          - k8s-cp-01
          - k8s-cp-03
          - k8s-worker-02
  interfaces:
    - ^lan0$
  externalIPs: false
  loadBalancerIPs: true
