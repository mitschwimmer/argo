apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-gateways
spec:
  # Deliberately DISABLED: 192.0.2.0/24 is TEST-NET-1, not our LAN.
  # Replace this block with a verified, DHCP-excluded 192.168.1.x range
  # before changing disabled to false. Never allocate the K3s API VIP
  # (192.168.1.110), node/host/router IPs, or DHCP lease addresses.
  disabled: true
  blocks:
    - start: 192.0.2.240
      stop: 192.0.2.247
  # Limit allocation to Services generated by Cilium Gateway API.
  serviceSelector:
    matchExpressions:
      - key: gateway.networking.k8s.io/gateway-name
        operator: Exists
