apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-gateways
spec:
  # The router's DHCP range ends at 192.168.1.200; the user confirmed that
  # .201 and above are free. Reserve .201-.220 for Cilium Gateway VIPs.
  # Do not overlap future static/DHCP allocations or the K3s API VIP .110.
  disabled: false
  blocks:
    - start: 192.168.1.201
      stop: 192.168.1.220
  # Limit allocation to Services generated by Cilium Gateway API.
  serviceSelector:
    matchExpressions:
      - key: gateway.networking.k8s.io/gateway-name
        operator: Exists
