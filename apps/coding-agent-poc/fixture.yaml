apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poc-fixture
  template:
    metadata:
      labels:
        app: poc-fixture
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: __IMAGE__
          command: [/bin/sh, -ec]
          args:
            - |
              if [ ! -d /data/repo.git ]; then
                seed=$(mktemp -d /data/seed.XXXXXX)
                trap 'rm -rf "$seed"' EXIT
                git init -b main "$seed/source"
                printf 'coding-agent-poc fixture\n' >"$seed/source/README.md"
                git -C "$seed/source" add README.md
                git -C "$seed/source" -c user.name=Fixture -c user.email=fixture@example.invalid commit -m fixture
                git init --bare "$seed/repo.git"
                git -C "$seed/source" push "$seed/repo.git" main
                git -C "$seed/repo.git" symbolic-ref HEAD refs/heads/main
                mv "$seed/repo.git" /data/repo.git
                rm -rf "$seed"
                trap - EXIT
              fi
              exec python3 /fixture/fixture.py /data /credentials
          env:
            - name: HOME
              value: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 8444
          readinessProbe:
            tcpSocket:
              port: https
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: script
              mountPath: /fixture
              readOnly: true
            - name: tls
              mountPath: /credentials/tls
              readOnly: true
            - name: git-auth
              mountPath: /credentials/git
              readOnly: true
            - name: json-auth
              mountPath: /credentials/json
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 32Mi
        - name: script
          configMap:
            name: fixture
        - name: tls
          secret:
            secretName: fixture-tls
        - name: git-auth
          secret:
            secretName: git-auth
        - name: json-auth
          secret:
            secretName: json-auth
---
apiVersion: v1
kind: Service
metadata:
  name: fixture
spec:
  selector:
    app: poc-fixture
  ports:
    - name: https
      port: 8444
      targetPort: https
