apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: coding-agent-poc
  labels:
    app.kubernetes.io/part-of: coding-agent-poc
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: task
spec:
  mergeGateways: false
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: task
spec:
  gatewayClassName: coding-agent-poc
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: task
  listeners:
    - name: https
      hostname: gateway.poc.test
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: fixture
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: fixture
      sectionName: https
  validation:
    hostname: fixture.poc.test
    caCertificateRefs:
      - kind: ConfigMap
        group: ""
        name: poc-ca
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: git-auth
spec:
  credentialInjection:
    overwrite: true
    credential:
      valueRef:
        name: git-auth
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: json-auth
spec:
  credentialInjection:
    overwrite: true
    credential:
      valueRef:
        name: json-auth
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: capabilities
spec:
  parentRefs:
    - name: task
      sectionName: https
  hostnames: [gateway.poc.test]
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /repo.git/info/refs
          queryParams:
            - name: service
              value: git-upload-pack
        - method: POST
          path:
            type: Exact
            value: /repo.git/git-upload-pack
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: git-auth
      backendRefs:
        - name: fixture
          port: 8444
    - matches:
        - method: GET
          path:
            type: Exact
            value: /private
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: json-auth
      backendRefs:
        - name: fixture
          port: 8444
