apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sandbox
spec:
  endpointSelector:
    matchLabels:
      app: poc-opencode
  ingressDeny:
    - fromEntities: [all]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: __ENVOY_NAMESPACE__
            k8s:gateway.envoyproxy.io/owning-gateway-namespace: coding-agent-poc
            k8s:gateway.envoyproxy.io/owning-gateway-name: task
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fixture
spec:
  endpointSelector:
    matchLabels:
      app: poc-fixture
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: __ENVOY_NAMESPACE__
            k8s:gateway.envoyproxy.io/owning-gateway-namespace: coding-agent-poc
            k8s:gateway.envoyproxy.io/owning-gateway-name: task
      toPorts:
        - ports:
            - port: "8444"
              protocol: TCP
