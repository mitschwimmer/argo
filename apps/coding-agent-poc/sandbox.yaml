apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: opencode
spec:
  podTemplate:
    metadata:
      labels:
        app: poc-opencode
    spec:
      runtimeClassName: kata-qemu-runtime-rs
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers: [127.0.0.1]
      hostAliases:
        - ip: "__GATEWAY_IP__"
          hostnames: [gateway.poc.test]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          image: __IMAGE__
          command: [opencode]
          args: [serve, --hostname, "127.0.0.1", --port, "4096"]
          workingDir: /workspace
          env:
            - name: HOME
              value: /workspace
            - name: SHELL
              value: /bin/sh
            - name: OPENCODE_DISABLE_MODELS_FETCH
              value: "true"
            - name: CURL_CA_BUNDLE
              value: /trust/ca.crt
            - name: GIT_SSL_CAINFO
              value: /trust/ca.crt
          readinessProbe:
            exec:
              command: [curl, --fail, --silent, --max-time, "3", --output, /dev/null, "http://127.0.0.1:4096/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: ca
              mountPath: /trust
              readOnly: true
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: ca
          configMap:
            name: poc-ca
