apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Match the bootstrap HelmChart's abort policy: never reinstall the CNI
  # automatically after a failed network chart upgrade.
  failurePolicy: abort
  valuesContent: |
    # The bootstrap HelmChart and release remain owned by K3s/nix-config.
    # These non-bootstrap networking features are owned by Argo CD.
    gatewayAPI:
      enabled: false
    # Cilium keeps its standalone Envoy for CNI L7 policy support.
    envoy:
      enabled: true
    # Kata guests use the veth service load balancer rather than the pod socket hook.
    socketLB:
      hostNamespaceOnly: true
    l2announcements:
      enabled: true
    # All K3s MicroVMs use a bridged interface named lan0.
    # The Cilium 1.20.4 Helm chart expects a comma-separated string.
    devices: "lan0"
    # The chart defaults to NOT restarting agents/operators on ConfigMap
    # changes. These settings make the networking updates
    # effective on a fresh cluster without manual rollout restarts.
    rollOutCiliumPods: true
    operator:
      rollOutPods: true
    # L2 announcers renew a Kubernetes Lease per advertised Service.
    k8sClientRateLimit:
      qps: 50
      burst: 100
