apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: hello-world
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      runtimeClassName: kata-qemu-runtime-rs
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-world
          # Minimal, shell-less, non-root image; the free image is frequently rebuilt.
          # Always pull on Pod creation so new Pods receive security updates.
          # CI scans the same image reference for all known CVE severities.
          image: cgr.dev/chainguard/nginx:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx needs writable locations even when the root is read-only.
            - name: run
              mountPath: /run
            - name: nginx-tmp
              mountPath: /var/lib/nginx/tmp
      volumes:
        - name: site
          configMap:
            name: hello-world
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
