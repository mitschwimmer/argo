apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
  namespace: kanidm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  domain: auth.archaic.work
  origin: https://auth.archaic.work
  # Only the Walter namespace may register a cross-namespace OIDC client.
  oauth2ClientNamespaceSelector:
    matchLabels:
      kaniop-identity: walter
  # Latest released Kanidm compatible with Kaniop v0.22.1 (SDK v1.11.2).
  # Review security fixes before exposing this version publicly.
  image: docker.io/kanidm/server:1.11.2
  replicaGroups:
    - name: primary
      replicas: 1
      primaryNode: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
  # Theme delivered by a Git-pinned Kustomize base; name is content-hashed.
  volumes:
    - name: archaic-theme
      configMap:
        name: kanidm-theme
  volumeMounts:
    - name: archaic-theme
      mountPath: /hpkg/override.css
      subPath: override.css
      readOnly: true

  # OpenEBS hostpath is node-local; off-cluster backups are required.
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: openebs-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  tlsSecretName: auth-archaic-work-backend-tls
  # Derived Service, HTTPRoute and BackendTLSPolicy belong to Kaniop.
  gateway:
    parentRefs:
      - name: public
        namespace: edge
        sectionName: https-auth
    backendTlsPolicy:
      validation:
        hostname: auth.archaic.work
        # Avoid Cilium 1.20.x System CA regression.
        caCertificateRefs:
          - group: ""
            kind: ConfigMap
            name: kanidm-backend-ca
