apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
  namespace: kanidm
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
    argocd.argoproj.io/sync-wave: "1"
spec:
  domain: auth.archaic.work
  origin: https://auth.archaic.work
  # Only allow OIDC clients from the named namespaces; argocd's Namespace
  # stays owned by the K3s bootstrap HelmChart.
  oauth2ClientNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - argocd
          - walter-dev
          - walter-prd
  # Match the Kanidm 1.12.1 client/protocol SDK in Kaniop v0.23.0.
  # Verify an off-cluster backup before upgrading the stateful database.
  image: docker.io/kanidm/server:1.12.1
  replicaGroups:
    - name: primary
      replicas: 1
      primaryNode: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
  # Theme delivered by a Git-pinned Kustomize base; name is content-hashed.
  volumes:
    - name: archaic-theme
      configMap:
        name: kanidm-theme
  volumeMounts:
    - name: archaic-theme
      mountPath: /hpkg/override.css
      subPath: override.css
      readOnly: true

  # OpenEBS hostpath is node-local; off-cluster backups are required.
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: openebs-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  tlsSecretName: auth-archaic-work-backend-tls
  # Derived Service, HTTPRoute and BackendTLSPolicy belong to Kaniop.
  gateway:
    parentRefs:
      - name: public
        namespace: edge
        sectionName: https-auth
    backendTlsPolicy:
      validation:
        hostname: auth.archaic.work
        # Avoid Cilium 1.20.x System CA regression.
        caCertificateRefs:
          - group: ""
            kind: ConfigMap
            name: kanidm-backend-ca
