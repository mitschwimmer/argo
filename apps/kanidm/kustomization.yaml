apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backend-ca.yaml
  - certificate.yaml
  - kanidm.yaml
  - person-henner.yaml
  - group-walter-users.yaml

# Generate a hashed name whenever the theme changes. A custom nameReference
# rule updates the ConfigMap reference inside Kaniop's Kanidm CRD.
configMapGenerator:
  - name: kanidm-nothing-theme
    namespace: kanidm
    files:
      - override.css=override.css

configurations:
  - kustomizeconfig.yaml
