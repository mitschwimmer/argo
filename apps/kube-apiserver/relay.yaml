apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-apiserver-relay
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-apiserver-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-apiserver-relay
    spec:
      # K3s runs the API server as a host process, not as a selectable Pod.
      # Relays give the Service ready/not-ready endpoints for each server.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-cp-01
                      - k8s-cp-02
                      - k8s-cp-03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      containers:
        - name: relay
          image: docker.io/alpine/socat:1.8.0.3
          command:
            - /bin/sh
            - -ec
          args:
            - exec socat TCP-LISTEN:6443,reuseaddr,fork TCP:${NODE_IP}:6443
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: api
              containerPort: 6443
              protocol: TCP
          # /readyz passes through socat and probes the real local K3s API.
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
      securityContext:
        seccompProfile:
          type: RuntimeDefault
