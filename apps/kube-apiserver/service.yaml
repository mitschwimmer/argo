apiVersion: v1
kind: Service
metadata:
  name: kube-apiserver-vip
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-apiserver-vip
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: kube-apiserver-relay
  ports:
    - name: https
      protocol: TCP
      port: 6443
      targetPort: api
