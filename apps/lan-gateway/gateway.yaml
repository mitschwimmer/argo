apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan
  namespace: edge
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.202
  listeners:
    - name: http
      hostname: "*.lan.archaic.work"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: "*.lan.archaic.work"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: lan-archaic-work-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: lan
