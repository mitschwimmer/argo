static_resources:
  listeners:
    - name: strata
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: strata
                normalize_path: true
                route_config:
                  name: strata
                  virtual_hosts:
                    - name: strata
                      domains: ["*"]
                      routes:
                        - match:
                            path: /v1/chat/completions
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: POST
                          route:
                            cluster: strata
                            host_rewrite_literal: "192.168.1.28:8080"
                            timeout: 0s
                http_filters:
                  # Use the mounted token for requests forwarded to Strata.
                  - name: envoy.filters.http.credential_injector
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                      overwrite: true
                      credential:
                        name: envoy.http.injected_credentials.generic
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                          credential:
                            name: strata-token
                          header_value_prefix: "Bearer "
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: strata
      type: STATIC
      connect_timeout: 5s
      load_assignment:
        cluster_name: strata
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 192.168.1.28
                      port_value: 8080
  secrets:
    - name: strata-token
      generic_secret:
        secret:
          filename: /run/strata/api-key
