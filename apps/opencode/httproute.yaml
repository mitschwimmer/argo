apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: lan
      namespace: edge
      sectionName: https
  hostnames:
    - agent.lan.archaic.work
  rules:
    - backendRefs:
        - name: opencode
          port: 80
      timeouts:
        request: 0s
