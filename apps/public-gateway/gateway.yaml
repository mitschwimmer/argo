apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: edge
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
    # cert-manager creates and renews the Certificate in the edge namespace.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: cilium
  # Stable LAN destination for home-router TCP 80/443 forwarding.
  addresses:
    - type: IPAddress
      value: 192.168.1.201
  listeners:
    - name: http
      # HTTP-01 challenges and redirects for all public hostnames.
      port: 80
      protocol: HTTP
      # ACME solver HTTPRoutes may attach from any namespace.
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: hello.archaic.work
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hello-archaic-work-tls
      # HTTPRoutes explicitly select this listener via parentRefs and hostname.
      allowedRoutes:
        namespaces:
          from: All
    - name: https-auth
      hostname: auth.archaic.work
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: auth-archaic-work-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-walter
      hostname: walter.archaic.work
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: walter-archaic-work-tls
      allowedRoutes:
        namespaces:
          from: All
