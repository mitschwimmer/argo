apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: edge
  annotations:
    # cert-manager creates and renews the Certificate in the edge namespace.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: cilium
  # Stable LAN destination for home-router TCP 80/443 forwarding.
  addresses:
    - type: IPAddress
      value: 192.168.1.201
  listeners:
    - name: http
      # HTTP-01 challenges and redirects for all public hostnames.
      port: 80
      protocol: HTTP
      # ACME solver HTTPRoutes may attach from opt-in namespaces.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: public
    - name: https
      hostname: hello.archaic.work
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hello-archaic-work-tls
      # Only opt-in namespaces may attach application routes.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: public
    - name: https-auth
      hostname: auth.archaic.work
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: auth-archaic-work-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: public
    - name: https-seal
      hostname: seal.archaic.work
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: seal-archaic-work-tls
      # Only HTTPRoutes in the Sealed Secrets namespace may attach here.
      # The built-in namespace name label avoids modifying the Helm-owned Namespace.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: sealed-secrets
    - name: https-walter
      hostname: walter.archaic.work
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: walter-archaic-work-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: public
    - name: https-walter-dev
      hostname: walter-dev.archaic.work
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: walter-dev-archaic-work-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: public
