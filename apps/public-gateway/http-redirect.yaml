apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: edge
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - hello.archaic.work
    - auth.archaic.work
  rules:
    # cert-manager's Exact ACME challenge path takes precedence over this prefix.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
