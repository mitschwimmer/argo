apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sealing-certificate
  namespace: sealed-secrets
spec:
  parentRefs:
    - name: public
      namespace: edge
      sectionName: https-seal
  hostnames:
    - seal.archaic.work
  rules:
    - matches:
        # Only expose the public certificate; never publish the controller API.
        - method: GET
          path:
            type: Exact
            value: /v1/cert.pem
      backendRefs:
        # The Helm chart owns this Service; no duplicate Service or proxy needed.
        - name: sealed-secrets-controller
          port: 8080
