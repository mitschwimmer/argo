apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: walter-develop
  namespace: walter-develop
spec:
  parentRefs:
    - name: public
      namespace: edge
      sectionName: https-walter-develop
  hostnames:
    - walter-develop.archaic.work
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: walter-develop
          port: 80
