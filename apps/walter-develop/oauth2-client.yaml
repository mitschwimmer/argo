apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: walter-develop
  namespace: walter
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: Walter (develop)
  description: Private chat UI - develop branch test instance
  origin: https://walter-develop.archaic.work
  redirectUrl:
    - https://walter-develop.archaic.work/auth/callback
  public: false
  strictRedirectUrl: true
  scopeMap:
    - group: walter-users
      scopes:
        - openid
        - profile
        - groups
  claimMap:
    - name: groups
      joinStrategy: array
      valuesMap:
        - group: walter-users
          values:
            - walter-users
  # Kaniop creates walter-develop-kanidm-oauth2-credentials in namespace walter.
