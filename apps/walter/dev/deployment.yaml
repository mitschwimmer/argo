apiVersion: apps/v1
kind: Deployment
metadata:
  name: walter
  namespace: walter-dev
  labels:
    environment: dev
spec:
  replicas: 1
  # Walter has one writer per data directory; do not run overlapping Pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: walter
  template:
    metadata:
      labels:
        app: walter
        environment: dev
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: walter
          # Publish this exact develop commit via manual OCI workflow_dispatch.
          image: ghcr.io/mitschwimmer/walter@sha256:8967bd7e4b02080dd057db4cbcc34d89da00a544448848016ed8d338901dd15c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WALTER_LISTEN
              value: 0.0.0.0:8080
            - name: WALTER_DATA_DIR
              value: /data
            - name: WALTER_PUBLIC_URL
              value: https://walter-dev.archaic.work
            - name: WALTER_OIDC_ISSUER
              value: https://auth.archaic.work/oauth2/openid/walter-dev
            - name: WALTER_OIDC_CLIENT_ID
              value: walter-dev
            - name: WALTER_OIDC_CLIENT_SECRET_FILE
              value: /run/secrets/walter-oidc
            # Kanidm's standard groups scope emits group SPNs, not short names.
            - name: WALTER_ALLOWED_GROUPS
              value: walter-users@auth.archaic.work
            - name: WALTER_INFERENCE_BACKEND
              value: openai
            - name: WALTER_INFERENCE_ENDPOINT
              value: http://192.168.1.28:8080/v1/chat/completions
            - name: WALTER_MODEL
              value: qwen3.8-flash-next-iq3_s
            - name: WALTER_INFERENCE_API_KEY_FILE
              value: /run/secrets/walter-strata
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: walter-data
        - name: credentials
          projected:
            # Kubelet applies fsGroup=65532, making group-readable secrets
            # accessible to the non-root container without world access.
            defaultMode: 0440
            sources:
              - secret:
                  name: walter-kanidm-oauth2-credentials
                  items:
                    - key: CLIENT_SECRET
                      path: walter-oidc
              - secret:
                  name: walter-strata-api-key
                  items:
                    - key: api-key
                      path: walter-strata
