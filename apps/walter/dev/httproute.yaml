apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: walter
  namespace: walter-dev
  labels:
    environment: dev
spec:
  parentRefs:
    - name: lan
      namespace: edge
      sectionName: https
  hostnames:
    - walter.lan.archaic.work
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: walter
          port: 80
