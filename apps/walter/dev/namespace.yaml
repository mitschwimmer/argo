apiVersion: v1
kind: Namespace
metadata:
  name: walter-dev
  labels:
    environment: dev
    app.kubernetes.io/name: walter
    gateway-access: public
    # Kaniop permits Walter OIDC clients from both opted-in namespaces.
    kaniop-identity: walter
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
