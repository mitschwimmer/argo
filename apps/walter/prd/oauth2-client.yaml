apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
  name: walter
  namespace: walter-prd
  labels:
    environment: prd
spec:
  # Kubernetes resource names stay identical; Kanidm client IDs must be unique.
  kanidmName: walter-prd
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: Walter (production)
  description: Walter prd chat UI
  origin: https://walter.archaic.work
  redirectUrl:
    - https://walter.archaic.work/auth/callback
  public: false
  strictRedirectUrl: true
  # Walter requests openid, profile and groups. Only walter-users may grant them.
  scopeMap:
    - group: walter-users
      scopes:
        - openid
        - profile
        - groups
  # Emit the exact group claim Walter checks; do not rely on SPN formatting.
  claimMap:
    - name: groups
      joinStrategy: array
      valuesMap:
        - group: walter-users
          values:
            - walter-users
  # Kaniop creates Secret walter-kanidm-oauth2-credentials in this namespace.
  # It contains CLIENT_SECRET, mounted directly into Walter's Pod.
