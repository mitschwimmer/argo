---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Manage the Envoy Gateway controller, extensions and GatewayClass.
  sourceRepos:
    - oci://registry-1.docker.io/envoyproxy/gateway-crds-helm
    - oci://registry-1.docker.io/envoyproxy/gateway-helm
    - https://github.com/mitschwimmer/argo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: envoy-gateway-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: envoy-gateway
  sources:
    - repoURL: oci://registry-1.docker.io/envoyproxy/gateway-crds-helm
      targetRevision: v1.10.0
      path: .
      helm:
        valuesObject:
          crds:
            gatewayAPI:
              enabled: false
            envoyGateway:
              enabled: true
    - repoURL: oci://registry-1.docker.io/envoyproxy/gateway-helm
      targetRevision: v1.10.0
      path: .
      helm:
        valuesObject:
          crds:
            enabled: false
    - repoURL: https://github.com/mitschwimmer/argo.git
      targetRevision: main
      path: apps/envoy-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
