---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Manage upstream Gateway API definitions and the Cilium GatewayClass.
  sourceRepos:
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://github.com/mitschwimmer/argo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: gateway.networking.k8s.io
      kind: GatewayClass
  namespaceResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
spec:
  project: gateway-api
  sources:
    # Match the seven required CRDs documented for Cilium 1.20.4.
    # Keep the stable upstream schemas pinned; no copied CRD manifests.
    - repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: v1.6.3
      path: config/crd/standard
      directory:
        include: '{gateway.networking.k8s.io_gatewayclasses.yaml,gateway.networking.k8s.io_gateways.yaml,gateway.networking.k8s.io_httproutes.yaml,gateway.networking.k8s.io_grpcroutes.yaml,gateway.networking.k8s.io_backendtlspolicies.yaml,gateway.networking.k8s.io_referencegrants.yaml,gateway.networking.k8s.io_tlsroutes.yaml}'
    # Manage GatewayClass here rather than from Cilium's bootstrap HelmChart.
    # This also works during fresh rebuilds when Cilium starts before the CRDs.
    - repoURL: https://github.com/mitschwimmer/argo.git
      targetRevision: main
      path: apps/gateway-api
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
      allowEmpty: false
    syncOptions:
      # Large CRD schemas can exceed client-side apply annotation limits.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
