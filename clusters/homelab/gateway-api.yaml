---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Manage Gateway API CRDs, Cilium HelmChartConfig and GatewayClass.
  sourceRepos:
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://github.com/mitschwimmer/argo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: gateway.networking.k8s.io
      kind: GatewayClass
  namespaceResourceWhitelist:
    - group: helm.cattle.io
      kind: HelmChartConfig
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
  name: gateway-api
  namespace: argocd
spec:
  project: gateway-api
  sources:
    # Match the seven required CRDs documented for Cilium 1.20.4.
    # Keep the stable upstream schemas pinned; no copied CRD manifests.
    - repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: v1.6.3
      path: config/crd/standard
      directory:
        include: '{gateway.networking.k8s.io_gatewayclasses.yaml,gateway.networking.k8s.io_gateways.yaml,gateway.networking.k8s.io_httproutes.yaml,gateway.networking.k8s.io_grpcroutes.yaml,gateway.networking.k8s.io_backendtlspolicies.yaml,gateway.networking.k8s.io_referencegrants.yaml,gateway.networking.k8s.io_tlsroutes.yaml}'
    # Manage the Cilium HelmChartConfig and GatewayClass after the CRDs.
    # K3s still owns the bootstrap HelmChart and the installed Helm release.
    - repoURL: https://github.com/mitschwimmer/argo.git
      targetRevision: main
      path: apps/gateway-api
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      # Protect controller/CRD/StorageClass lifecycle from auto deletion.
      prune: false
      allowEmpty: false
    syncOptions:
      # Large CRD schemas can exceed client-side apply annotation limits.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
