---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: walter-dev
  namespace: argocd
  labels:
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Walter (dev) workload within its own namespace.
  sourceRepos:
    - https://github.com/mitschwimmer/argo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: walter-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Service
    - group: kaniop.rs
      kind: KanidmOAuth2Client
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: bitnami.com
      kind: SealedSecret
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: walter-dev
  namespace: argocd
  labels:
    environment: dev
spec:
  project: walter-dev
  source:
    repoURL: https://github.com/mitschwimmer/argo.git
    targetRevision: main
    path: apps/walter/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: walter-dev
  syncPolicy:
    # Cutover safety: old Application walter still exists because root pruning
    # is disabled. Sync manually only after removing the old application/route.
    automated:
      enabled: false
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
